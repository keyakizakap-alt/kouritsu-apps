name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 依存に新しい脆弱性が見つかったことに気づけるよう、変更がなくても毎週実行する
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # ランナーにキャッシュされた 24.x はセキュリティ修正前の場合があるため、常に最新を取得する
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Format
        run: npm run format:check
      - name: Python deps for apps/powerbi-viewer
        # ブラウザ内の Pyodide と同じ版の pandas / python-calamine で解析エンジンをテストする
        run: |
          python3 -m venv .venv
          # ハッシュ不一致・ソース配布物（ビルド時にコードを実行する）を拒否する
          .venv/bin/pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r apps/powerbi-viewer/requirements-dev.txt
      - name: Tests and spec check
        run: npm test
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run smoke
